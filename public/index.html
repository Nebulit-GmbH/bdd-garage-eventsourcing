<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BDD Parking Garage</title>
    <link rel="stylesheet" href="garage.css">
</head>
<body>
<main id="stage">
    <div id="frame">
        <canvas id="garage" width="480" height="270" aria-label="Top-down parking garage simulation"></canvas>
        <a id="em-studio-link" href="https://eventmodelers.ai" target="_blank" rel="noopener">EM-STUDIO</a>
        <div id="white-field">
            <a class="original" href="https://www.youtube.com/watch?v=4ucE6pxHLMY" target="_blank" rel="noopener">Original video</a>
            <a href="https://www.eventmodelers.ai" target="_blank" rel="noopener">Planning with Event Modeling</a>
            <a href="https://app.eventmodelers.ai" target="_blank" rel="noopener">using EM-Studio</a>
            <a href="https://github.com/event-driven-io/emmett" target="_blank" rel="noopener">Powered by Emmett</a>
            <a href="https://app.eventmodelers.ai/documentation#agentic-building" target="_blank" rel="noopener">(using the Node Build-Kit)</a>
        </div>
        <nav id="controls" aria-label="Simulation speed">
            <button type="button" data-speed="0" title="Pause (Space)">II</button>
            <button type="button" data-speed="1" title="1 simulated minute per second (key 1)">1 MIN/S</button>
            <button type="button" data-speed="2" title="10 simulated minutes per second (key 2)">10 MIN/S</button>
            <button type="button" data-speed="3" title="1 simulated hour per second (key 3)">1 H/S</button>
            <label id="capacity-label" title="Number of spots in the garage">SPOTS <input type="number" id="capacity" min="1" step="1"></label>
            <button type="button" id="lose-ticket" disabled title="Select a parked car, then mark its ticket as lost (key L)">LOST TICKET</button>
            <button type="button" id="reset-all" title="Delete all events and read models, then reload">RESET ALL</button>
            <button type="button" id="add-car" title="Send a car to the entry (key C)">+ CAR</button>
        </nav>
    </div>
</main>
<script type="module" src="js/garage.js"></script>
<script type="module" src="js/events-debug.js"></script>
</body>
</html>
